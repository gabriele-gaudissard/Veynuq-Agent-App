name: Test and publish Veynuq
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veyq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore pinned verification tools from repository history
        # Development-only files stay out of the user's main tree and ZIP.
        # This immutable baseline contains 238 backend checks and the UI suite.
        run: |
          git fetch --depth=1 origin 42011bb9bc5600b644ed60115c9beaddfa34a861
          git restore --source=42011bb9bc5600b644ed60115c9beaddfa34a861 --worktree -- tests package.json package-lock.json ui-translations.json
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py veyq
      - run: node --check app.js
      - run: npm ci --no-audit --no-fund
      - run: npm test

  sandbox-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore pinned controlled sandbox checks
        run: |
          git fetch --depth=1 origin 42011bb9bc5600b644ed60115c9beaddfa34a861
          git restore --source=42011bb9bc5600b644ed60115c9beaddfa34a861 --worktree -- tests
      - run: python -m pip install -r requirements.txt
      - run: docker pull python:3.13-slim
      - run: python -m unittest discover -s tests -p test_advanced.py -v
        env:
          VEYNUQ_DOCKER_QA: "1"

  fresh-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore pinned fresh-install verification
        run: |
          git fetch --depth=1 origin 42011bb9bc5600b644ed60115c9beaddfa34a861
          git restore --source=42011bb9bc5600b644ed60115c9beaddfa34a861 --worktree -- tests
      - run: python -m pip install 'cryptography>=46,<49'
      - run: python tests/fresh_install_check.py

  native-setup-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore native installer checks
        run: |
          git fetch --depth=1 origin 42011bb9bc5600b644ed60115c9beaddfa34a861
          git restore --source=42011bb9bc5600b644ed60115c9beaddfa34a861 --worktree -- tests
      - run: .github/prepare_compiler.ps1
      - run: python tests/native_setup_check.py --compiler "$env:VEYNUQ_ISCC"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, sandbox-test, fresh-installer, native-setup-test]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install 'cryptography>=46,<49'
      - run: python .github/build_release.py release
        env:
          VEYQ_RELEASE_SIGNING_KEY: ${{ secrets.VEYQ_RELEASE_SIGNING_KEY }}
      - run: .github/prepare_compiler.ps1
      - run: python .github/build_setup.py release --compiler "$env:VEYNUQ_ISCC"
      - name: Publish verified app update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${BUILD_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/veyq-update.zip release/veyq-update.json release/Veynuq-Setup.exe release/Veynuq-Setup.exe.sha256 --clobber
          else
            gh release create "$tag" release/veyq-update.zip release/veyq-update.json release/Veynuq-Setup.exe release/Veynuq-Setup.exe.sha256 --target "$BUILD_SHA" --title "Veynuq 4.6.0 · ${BUILD_SHA:0:7}" --notes "Download Veynuq-Setup.exe for automatic installation and complete configuration. The ZIP remains available for manual installation. Existing managed installations update automatically." --latest
          fi
